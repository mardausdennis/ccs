name: Usage PR template evidence

on:
  push:
    branches: [evidence/usage-template-20261116]
    paths: [.github/workflows/usage-template-evidence.yml]

permissions:
  contents: read

jobs:
  exact-head:
    if: github.repository == 'mardausdennis/ccs'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 1822
            sha: d60a5ef4b3107fb6db0950e3cb099d9ed12e69b9
          - pr: 1823
            sha: b8cb7e456f25565012aa985f607ee12836935225
    name: PR ${{ matrix.pr }} exact head
    env:
      CI: 'true'
      CCS_HOME: /tmp/ccs-evidence-${{ matrix.pr }}
      BUN_INSTALL_CACHE_DIR: /tmp/bun-evidence-${{ matrix.pr }}
      HUSKY: '0'
      EVIDENCE: /tmp/usage-evidence-${{ matrix.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mardausdennis/ccs
          ref: ${{ matrix.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bind exact source and non-detached parity branch
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          mkdir -p "$EVIDENCE" "$CCS_HOME"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git checkout -b "fix/evidence-pr-$PR_NUMBER" "$EXPECTED_SHA"
          git remote set-url origin https://github.com/kaitranntt/ccs.git
          git fetch origin dev --quiet
          git merge-base --is-ancestor origin/dev HEAD
          test -z "${CCS_SKIP_PREPUSH_GATE:-}"
          test -z "$(git status --porcelain)"
          {
            date -u +%FT%TZ
            git rev-parse HEAD HEAD^{tree} origin/dev
            git branch --show-current
            node --version
            bun --version
            uname -a
          } | tee "$EVIDENCE/identity.txt"
          # These ports are never usable by this disposable runner's tests.
          sudo iptables -I OUTPUT -p tcp --dport 8317 -j REJECT
          sudo iptables -I OUTPUT -p tcp --dport 3000 -j REJECT
          sudo ip6tables -I OUTPUT -p tcp --dport 8317 -j REJECT
          sudo ip6tables -I OUTPUT -p tcp --dport 3000 -j REJECT

      - name: Install the target's locked dependencies
        run: bash scripts/ensure-deps.sh

      - name: Exact format, lint fix and validate chain
        id: validate
        continue-on-error: true
        run: |
          set +e
          (bun run format && bun run lint:fix && bun run validate) 2>&1 | tee "$EVIDENCE/validate.log"
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > "$EVIDENCE/validate.exit"
          exit "$result"

      - name: Prove formatting and lint fixes left the exact head unchanged
        if: always() && steps.validate.outcome != 'skipped'
        id: write-check
        continue-on-error: true
        run: |
          git diff --binary > "$EVIDENCE/after-format-lint.diff"
          git status --porcelain > "$EVIDENCE/after-format-lint.status"
          git diff --exit-code
          test ! -s "$EVIDENCE/after-format-lint.status"
          test "$(git rev-parse HEAD)" = '${{ matrix.sha }}'

      - name: Exact validate ci parity command, without skip flags
        if: steps.write-check.outcome == 'success'
        id: parity
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set +e
          bun run validate:ci-parity 2>&1 | tee "$EVIDENCE/ci-parity.log"
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > "$EVIDENCE/ci-parity.exit"
          exit "$result"

      - name: Record final source state and firewall counters
        if: always()
        run: |
          git rev-parse HEAD HEAD^{tree} > "$EVIDENCE/final-identity.txt"
          git diff --binary > "$EVIDENCE/final.diff"
          git status --porcelain > "$EVIDENCE/final.status"
          sudo iptables -nvL OUTPUT > "$EVIDENCE/firewall-ipv4.txt"
          sudo ip6tables -nvL OUTPUT > "$EVIDENCE/firewall-ipv6.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usage-pr-${{ matrix.pr }}-exact-head
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: error
          retention-days: 30

      - name: Require both literal chains and no source rewrite
        if: always()
        env:
          VALIDATE: ${{ steps.validate.outcome }}
          WRITES: ${{ steps.write-check.outcome }}
          PARITY: ${{ steps.parity.outcome }}
        run: |
          printf 'validate=%s writes=%s parity=%s\n' "$VALIDATE" "$WRITES" "$PARITY"
          test "$VALIDATE" = success
          test "$WRITES" = success
          test "$PARITY" = success
          test ! -s "$EVIDENCE/final.diff"
          test ! -s "$EVIDENCE/final.status"
